{% extends "layout.html" %}

{% block title %}
    Payment
{% endblock %}

{% block main %}
<div style="display: flex; justify-content: center; margin-top: 60px;">
  <div class="apple-card" style="max-width: 500px; width: 100%; text-align: center;">
    
    <h1 style="font-size: 28px; margin-bottom: 8px;">How would you like to pay?</h1>
    <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 14px;">Select a secure payment method.</p>

    <form action="/payment" method="post">
      
      <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px;">
        <!-- Option 1 -->
        <label style="border: 1px solid var(--accent); border-radius: 12px; padding: 20px; display: flex; align-items: center; cursor: pointer; transition: background 0.2s; text-align: left;">
          <input type="radio" name="payment_method" value="cash" checked style="margin-right: 16px;">
          <div>
            <div style="font-weight: 500;">Pay Cash on Delivery</div>
            <div style="font-size: 12px; color: var(--text-secondary);">Pay when your order arrives.</div>
          </div>
        </label>
        
        <!-- Option 2 -->
        <label style="border: 1px solid #d2d2d7; border-radius: 12px; padding: 20px; display: flex; align-items: center; cursor: pointer; transition: background 0.2s; text-align: left; opacity: 0.6;">
          <input type="radio" name="payment_method" value="other" disabled style="margin-right: 16px;">
          <div>
            <div style="font-weight: 500;">Credit/Debit Card (Coming Soon)</div>
            <div style="font-size: 12px; color: var(--text-secondary);">Apple Pay, Visa, Mastercard, AMEX.</div>
          </div>
        </label>
      </div>

      <button class="btn-apple" type="submit" style="width: 100%;">Complete Order</button>
    </form>
    
  </div>
</div>
{% endblock %}
