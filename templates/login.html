{% extends "layout.html" %}

{% block title %}
    Sign In
{% endblock %}

{% block main %}
<div style="display: flex; justify-content: center; margin-top: 60px;">
  <div class="apple-card" style="max-width: 400px; width: 100%; text-align: center;">
    
    <h1 style="font-size: 28px; margin-bottom: 8px;">Sign in to Store</h1>
    <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 14px;">Enter your details below to continue.</p>

    <form action="/login" method="post">
      <input autocomplete="off" autofocus class="input-apple" id="username" name="username" placeholder="Username" type="text" required>
      <input class="input-apple" id="password" name="password" placeholder="Password" type="password" required>
      
      <button class="btn-apple" type="submit" style="width: 100%; margin-top: 16px;">Sign In</button>
    </form>

    <div style="margin-top: 24px; font-size: 14px; color: var(--text-secondary);">
      Don't have an Apple ID? <a href="/register">Create yours now.</a>
    </div>

  </div>
</div>
{% endblock %}
